[package]
name = "whimpr-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "whimpr_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
whimpr-core = { path = "../crates/whimpr-core" }
whimpr-ipc = { path = "../crates/whimpr-ipc" }
whimpr-audio = { path = "../crates/whimpr-audio" }
whimpr-asr = { path = "../crates/whimpr-asr" }
whimpr-cleanup = { path = "../crates/whimpr-cleanup" }
keyring = "3"
strsim = "0.11"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
# Frontmost-app detection (paste-target → per-app cleanup formatting). Already in
# the tree via Tauri; declared here so we can call NSWorkspace directly.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    # Overlay pill: raise the window above the Dock and join full-screen Spaces.
    "NSWindow",
    "NSResponder",
    # The pill is promoted to a non-activating NSPanel so it can float over other
    # apps' full-screen Spaces, which a plain NSWindow cannot do at any level.
    "NSPanel",
    # Record-start ping (/System/Library/Sounds/Pop.aiff).
    "NSSound",
] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }
