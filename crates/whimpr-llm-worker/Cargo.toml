[package]
name = "whimpr-llm-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Standalone local-LLM worker process. Kept a SEPARATE binary (not linked into the
# Tauri app) because llama.cpp's ggml and whisper.cpp's ggml can't coexist in one
# binary. The app spawns it and talks to it over stdio (one JSON request per line).
[[bin]]
name = "whimpr-llm-worker"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# Stateful UTF-8 decoder for token_to_piece: multi-byte characters can straddle
# two tokens, so one decoder has to span the whole generation.
encoding_rs = "0.8"

# examples/dictionary_check.rs drives the real prompt-assembly path against this
# worker, so it needs core's dictionary + cleanup. Dev-only: the worker binary
# itself stays dependency-light.
[dev-dependencies]
whimpr-core = { path = "../whimpr-core" }
# `cleanup_check --cloud` drives the same cloud provider the app uses, rather than a
# second hand-rolled HTTP call that could drift from it, and reads the key from the
# same Keychain entry so there is nothing to paste or export. `apple-native` is
# required here for the same reason it is in src-tauri: without it keyring 3
# substitutes an in-memory mock and the lookup silently finds nothing.
whimpr-cleanup = { path = "../whimpr-cleanup" }
keyring = { version = "3", features = ["apple-native"] }

[dependencies.llama-cpp-2]
version = "0.1"
features = ["metal"]
