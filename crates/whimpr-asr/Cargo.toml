[package]
name = "whimpr-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Local speech-to-text. First engine: whisper.cpp via whisper-rs (Metal on macOS),
# implementing the AsrEngine trait from whimpr-core. Parakeet/FluidAudio is the
# planned latency upgrade behind the same trait.
[dependencies]
whimpr-core = { path = "../whimpr-core" }
anyhow = { workspace = true }

[dev-dependencies]
hound = "3"

[dependencies.whisper-rs]
version = "0.12"
features = ["metal"]

# Cloud ASR (Groq). `multipart` is what uploads the WAV; rustls avoids linking
# OpenSSL. `blocking` matches the rest of the pipeline, which is thread-per-dictation.
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "multipart", "rustls-tls"]

[dependencies.serde_json]
workspace = true
