# The Xcode project is generated from this file — do not edit WhimprFlow.xcodeproj by
# hand, and do not add files through Xcode's UI expecting them to stick. Run
# `xcodegen generate` in this directory after changing anything here; the `sources`
# entries below are directories, so a new .swift file inside one needs no change at
# all, only a regenerate.
#
# Generated rather than committed because a hand-maintained .pbxproj fails as "the
# project file cannot be parsed", with no indication of which of its several hundred
# UUIDs is wrong.

name: WhimprFlow
options:
  bundleIdPrefix: com.whimpr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # VSTTF2AM22 is the paid team that holds the Developer ID and the notary profile.
    # NOT 3V3J78V32Q, which owns the older Apple Development certs on this machine —
    # mixing them fails with a 403 about "a required agreement is missing or has
    # expired", which is not what it sounds like.
    DEVELOPMENT_TEAM: VSTTF2AM22
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO # the cargo build phase writes outside the target dir

packages: {}

targets:
  # ---------------------------------------------------------------- the container app
  WhimprFlow:
    type: application
    platform: iOS
    sources:
      - path: WhimprFlow
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whimpr.whimprflow
        INFOPLIST_FILE: WhimprFlow/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhimprFlow/WhimprFlow.entitlements
        # Bump MARKETING_VERSION for a release people notice; bump
        # CURRENT_PROJECT_VERSION for every TestFlight upload — App Store Connect
        # rejects a build whose (version, build) pair it has already seen.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The bridge is a plain C library, not a module, so Swift reaches it through
        # a bridging header rather than an `import`.
        # Quoted, and it must stay quoted: HEADER_SEARCH_PATHS is a space-separated
        # list, and this repository's own path contains spaces ("projects and
        # learning"), so an unquoted value is silently split into two nonexistent
        # paths and the bridging header fails to resolve.
        HEADER_SEARCH_PATHS: '"$(SRCROOT)/../crates/whimpr-ffi/include"'
        SWIFT_OBJC_BRIDGING_HEADER: Shared/WhimprFlow-Bridging-Header.h
    dependencies:
      - target: WhimprKeyboard
        embed: true
      - framework: Frameworks/WhimprCore.xcframework
        embed: false # a static library: linked in, nothing to embed
    preBuildScripts:
      - name: Build whimpr-core for iOS
        # Keeps the linked .a in step with the Rust source. Without this an edit to
        # whimpr-core builds green and runs the previous logic, which is the exact
        # failure the shared core exists to prevent.
        script: PROFILE=release "$SRCROOT/../scripts/build-ios-core.sh"
        basedOnDependencyAnalysis: false

  # ------------------------------------------------------------- the keyboard extension
  # Cannot record audio: app extensions have no microphone entitlement, and no
  # setting changes that. It signals the container app, which records. See
  # ios/README.md.
  WhimprKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whimpr.whimprflow.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/WhimprKeyboard.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Same two settings as the app target, and for the same reason — the
        # extension links the core too. Quoted because this repository's path
        # contains spaces and this setting is a space-separated list.
        HEADER_SEARCH_PATHS: '"$(SRCROOT)/../crates/whimpr-ffi/include"'
        SWIFT_OBJC_BRIDGING_HEADER: Shared/WhimprFlow-Bridging-Header.h
    dependencies:
      - framework: Frameworks/WhimprCore.xcframework
        embed: false
